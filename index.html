      outline: none;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);

      padding: 20px;
      backdrop-filter: blur(12px);

      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .card:hover, .card:active {

<!DOCTYPE html>
<html lang="ru">
<head>

    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #2d3748;

        body {

            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        h1 {
            text-align: center;

        .subtitle {

        .controls {

        .dot {

            cursor: pointer;
            transition: all 0.3s;

        .dot.active {
            background: var(--iroh-red);
            transform: scale(1.3);

        .btn {
            background: var(--text-main);
            color: white;
            border: none;

            font-weight: bold;

            background: var(--iroh-red);

        /* SVG Animations */
        @keyframes dash {
            to { stroke-dashoffset: -40; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }

        @keyframes movePacket {

</head>
<body>

    <div class="container">
        <h1>Iroh: Магическая рация 🪄</h1>
        <div class="subtitle">Как компьютеры общаются напрямую (объяснение для 5-леток)</div>

        <!-- Шаг 1: Обычный интернет -->
        <div class="slide active" id="slide-0">
            <div class="svg-box">
                <svg width="600" height="250" viewBox="0 0 600 250">
                    <!-- Связи -->
                    <path d="M 150 125 L 300 80" stroke="#cbd5e1" stroke-width="4" fill="none" />
                    <path d="M 450 125 L 300 80" stroke="#cbd5e1" stroke-width="4" fill="none" />
                    
                    <!-- Данные к серверу -->
                    <circle cx="0" cy="0" r="6" fill="var(--node-blue)">
                        <animateMotion dur="2s" repeatCount="infinite" path="M 150 125 L 300 80" />
                    </circle>
                    <circle cx="0" cy="0" r="6" fill="var(--server-gray)">
                        <animateMotion dur="2s" repeatCount="infinite" path="M 300 80 L 450 125" begin="1s" />
                    </circle>

                    <!-- Компьютер 1 -->
                    <g transform="translate(90, 95)">
                        <rect x="0" y="0" width="80" height="50" rx="5" fill="var(--node-blue)" />
                        <rect x="-10" y="55" width="100" height="10" rx="3" fill="#2b6cb0" />
                        <text x="40" y="30" fill="white" font-size="14" text-anchor="middle" font-weight="bold">Ты</text>
                    </g>

                    <!-- Сервер (Начальник) -->
                    <g transform="translate(260, 20)">
                        <rect x="0" y="0" width="80" height="100" rx="8" fill="var(--server-gray)" />
                        <circle cx="20" cy="20" r="5" fill="#fc8181" />
                        <circle cx="20" cy="40" r="5" fill="#fc8181" />

                    <!-- Компьютер 2 -->
                    <g transform="translate(410, 95)">
                        <rect x="0" y="0" width="80" height="50" rx="5" fill="var(--node-green)" />
                        <rect x="-10" y="55" width="100" height="10" rx="3" fill="#2f855a" />
                        <text x="40" y="30" fill="white" font-size="14" text-anchor="middle" font-weight="bold">Друг</text>
                    </g>
                </svg>
            </div>
            <div class="thesis-card">
                1. Как работают обычные программы
                <div class="thesis-sub">Чтобы передать картинку другу, ты сначала отдаешь её "Главному Почтальону" (Серверу), а он несет её другу. Это долго, а Почтальон может устать.</div>
            </div>
        </div>

        <!-- Шаг 2: Iroh -->
        <div class="slide" id="slide-1">
            <div class="svg-box">
                <svg width="600" height="250" viewBox="0 0 600 250">
                    <!-- Прямая связь (Iroh) -->
                    <line x1="150" y1="125" x2="450" y2="125" stroke="var(--iroh-red)" stroke-width="8" class="animated-line" />
                    
                    <!-- Данные напрямую -->
                    <circle cx="0" cy="0" r="8" fill="#fff" stroke="var(--iroh-red)" stroke-width="3">
                        <animateMotion dur="1s" repeatCount="infinite" path="M 150 125 L 450 125" />
                    </circle>
                    <circle cx="0" cy="0" r="8" fill="#fff" stroke="var(--node-green)" stroke-width="3">

                    </circle>

                    <g transform="translate(90, 95)" class="pulse-node">
                        <rect x="0" y="0" width="80" height="50" rx="5" fill="var(--node-blue)" />
                        <rect x="-10" y="55" width="100" height="10" rx="3" fill="#2b6cb0" />
                        <text x="40" y="30" fill="white" font-size="14" text-anchor="middle" font-weight="bold">Ты</text>
                    </g>

                    <!-- Компьютер 2 -->
                    <g transform="translate(410, 95)" class="pulse-node">
                        <rect x="0" y="0" width="80" height="50" rx="5" fill="var(--node-green)" />
                        <rect x="-10" y="55" width="100" height="10" rx="3" fill="#2f855a" />

                </svg>
            </div>
            <div class="thesis-card">
                2. Как работает Iroh (P2P)
                <div class="thesis-sub">Iroh дает вам магические рации. Вы общаетесь <strong>напрямую друг с другом</strong>, без Почтальона! Это работает мгновенно.</div>
            </div>
        </div>

        <!-- Шаг 3: Маршрутизация по ключам -->
        <div class="slide" id="slide-2">
            <div class="svg-box">
                <svg width="600" height="250" viewBox="0 0 600 250">
                    <!-- Линия связи -->
                    <path id="connectionPath" d="M 150 125 L 450 125" stroke="var(--iroh-red)" stroke-width="4" stroke-dasharray="8" />
                    
                    <!-- Ключ (Бейджик) по центру -->
                    <g transform="translate(280, 100)">
                        <circle cx="20" cy="25" r="25" fill="#fbd38d" />
                        <path d="M 20 15 A 5 5 0 0 1 20 25 A 5 5 0 0 1 20 15 Z" fill="#b7791f"/>
                        <rect x="18" y="25" width="4" height="12" fill="#b7791f"/>
                        <rect x="22" y="30" width="6" height="4" fill="#b7791f"/>
                        <text x="20" y="65" fill="#975a16" font-size="12" text-anchor="middle" font-weight="bold">Имя-Ключ</text>
                    </g>

                    <!-- Компьютер 1 (перемещается) -->
                    <g fill="var(--node-blue)">
                        <animateTransform attributeName="transform" type="translate" values="90,95; 90,40; 90,95" dur="4s" repeatCount="infinite" />
                        <rect x="0" y="0" width="80" height="50" rx="5" />
                        <rect x="-10" y="55" width="100" height="10" rx="3" fill="#2b6cb0" />
                        <!-- Иконка Wi-Fi -->
                        <path d="M 25 25 Q 40 10 55 25" stroke="white" stroke-width="2" fill="none"/>
                        <path d="M 32 32 Q 40 22 48 32" stroke="white" stroke-width="2" fill="none"/>

                        <rect x="-10" y="55" width="100" height="10" rx="3" fill="#2f855a" />
                    </g>
                    
                    <text x="130" y="35" fill="var(--text-muted)" font-size="14" text-anchor="middle">Кафе (Новый Wi-Fi)</text>
                    <text x="130" y="195" fill="var(--text-muted)" font-size="14" text-anchor="middle">Дом (Старый Wi-Fi)</text>

            <div class="thesis-card">

                    <line x1="320" y1="145" x2="450" y2="145" stroke="#fc8181" stroke-width="4" stroke-dasharray="5" />

                    </g>

            <div class="thesis-card">

                <div class="thesis-sub">А если между вами глухая стена (злой роутер), и напрямую крикнуть нельзя? Iroh сам найдет <strong>Умного Помощника</strong> высоко в небе, который перекинет записку через стену!</div>
            </div>

        <div class="controls">
            <button class="btn" id="prevBtn" onclick="changeSlide(-1)">Назад</button>
            <div class="dot active" onclick="setSlide(0)"></div>
            <div class="dot" onclick="setSlide(1)"></div>
            <div class="dot" onclick="setSlide(2)"></div>
            <div class="dot" onclick="setSlide(3)"></div>
            <button class="btn" id="nextBtn" onclick="changeSlide(1)">Дальше</button>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        
        function updateUI() {
            let slides = document.querySelectorAll('.slide');
            let dots = document.querySelectorAll('.dot');
            
            for (let i = 0; i < slides.length; i++) {
                slides[i].classList.remove('active');
                dots[i].classList.remove('active');
            }
            
            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
            
            document.getElementById('prevBtn').style.opacity = currentSlide === 0 ? '0.5' : '1';
            document.getElementById('prevBtn').style.pointerEvents = currentSlide === 0 ? 'none' : 'auto';
            
            document.getElementById('nextBtn').style.opacity = currentSlide === slides.length - 1 ? '0.5' : '1';
            document.getElementById('nextBtn').style.pointerEvents = currentSlide === slides.length - 1 ? 'none' : 'auto';
        }

        function changeSlide(direction) {
            let slidesCount = document.querySelectorAll('.slide').length;
            let newSlide = currentSlide + direction;
            
            if (newSlide >= 0 && newSlide < slidesCount) {
                currentSlide = newSlide;
                updateUI();
            }
        }

        function setSlide(index) {
            currentSlide = index;
            updateUI();
        }

        updateUI();
    </script>
