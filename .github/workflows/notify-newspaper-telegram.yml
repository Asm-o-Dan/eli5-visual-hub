name: Telegram — утренний лист

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Find a changed newspaper issue
        id: issue
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          file="$(git diff-tree --no-commit-id --name-only -r "$DEPLOY_SHA" | grep -E '^artifacts/utrenniy-list-[0-9]{4}-[0-9]{2}-[0-9]{2}\.html$' | head -n 1 || true)"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Send issue link to Telegram
        if: steps.issue.outputs.file != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ISSUE_FILE: ${{ steps.issue.outputs.file }}
        run: python3 scripts/send_newspaper_telegram.py "$ISSUE_FILE"
