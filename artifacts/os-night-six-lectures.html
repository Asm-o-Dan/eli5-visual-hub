:root{color-scheme:dark;--bg:#101827;--card:#1b2940;--muted:#aabbd0;--a:#66e2c1;--gold:#f7c76e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef5fc;font:16px/1.6 system-ui,-apple-system,sans-serif}header{padding:22px 20px 12px;max-width:1050px;margin:auto}header small,.muted{color:var(--muted)}h1{font-size:clamp(27px,6vw,48px);line-height:1.12;letter-spacing:-.04em;margin:10px 0}h2{line-height:1.2;font-size:27px}h3{line-height:1.25;color:var(--a)}nav{display:flex;gap:8px;overflow:auto;position:sticky;top:0;z-index:5;background:#101827f2;padding:10px max(16px,calc((100vw - 1018px)/2));border-bottom:1px solid #34435a;scrollbar-width:none}button,select,input,textarea{font:inherit}button,select{background:#24354d;color:#fff;border:1px solid #486079;border-radius:12px;padding:10px 14px;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--gold)}nav button{white-space:nowrap;font-size:14px}nav button.active,.primary{background:var(--a);color:#10231f;border-color:var(--a);font-weight:700}main{max-width:1050px;margin:auto;padding:20px 16px 80px}.card{background:var(--card);border:1px solid #30435b;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}.grid .card{margin:0}.tag{display:inline-block;color:var(--a);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.lead{font-size:18px;color:#d5e3ef}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}details{border-top:1px solid #34465c;padding:14px 0}summary{cursor:pointer;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 system-ui;color:#ced9e6}textarea,input{background:#101827;color:white;border:1px solid #53657a;border-radius:10px;padding:10px;width:100%}textarea{min-height:110px}label{display:block;margin:9px 0}.choice{display:block;width:100%;text-align:left;margin:8px 0}.good{color:#71ecc7}.bad{color:#ffad9b}.note{border-left:3px solid var(--gold);padding-left:14px;color:#f3dfbc}.bar{height:8px;background:#33455c;border-radius:9px;overflow:hidden}.bar i{display:block;background:var(--a);height:100%}.gantt{display:flex;overflow:auto;margin:12px 0}.gantt span{min-width:62px;border:1px solid #63778c;padding:8px;font-size:13px}.hidden{display:none}a{color:var(--a)}.foot{color:#9bacc0;font-size:13px}@media(max-width:500px){.card{padding:16px}header{padding-top:17px}button{min-height:44px}}
</style></head><body><header><small>ELI5 VISUAL HUB / УЧЕБНАЯ ЛАБОРАТОРИЯ</small><h1>Операционные системы<br><span style="color:var(--a)">за одну ночь</span></h1><p class="muted">6 лекций · объяснения, тренажёры и самопроверка · работает на телефоне</p></header><nav id="nav"></nav><main id="app"></main><script>
const DATA={"sections": [["Основы ОС и аппаратура", "40 мин", "ПО и трансляция", "Прикладное ПО решает задачи пользователя; системное управляет ресурсами и поддерживает программы; инструментальное помогает создавать ПО. Транслятор преобразует программу между представлениями. Компилятор обычно переводит код до исполнения; интерпретатор выполняет программу по мере анализа. Современные среды совмещают подходы: C# компилируется в IL, затем JIT переводит его в машинный код.", "Роль ОС", "ОС — комплекс программ, управляющий ресурсами и предоставляющий среду выполнения. Шесть функций: процессы, память, ввод-вывод, файлы, безопасность, сеть. В формулировке лекции функции — внутренние механизмы, задачи — результаты: интерфейс, запуск программ, абстракция оборудования, взаимодействие пользователей, обработка ошибок. Файловая система скрывает детали диска.", "Интерфейсы и железо", "GUI — графический интерфейс; CLI — командный интерфейс; терминал предоставляет окно для текстового взаимодействия, shell интерпретирует команды. API — интерфейс функций, syscall — контролируемый вход в ядро; API может вызывать syscall или работать без него. CPU содержит АЛУ, устройство управления и регистры; RIP — адрес следующей инструкции, RSP — указатель стека, CR3 в x86 связан с таблицами страниц. Регистры → кэш → RAM → внешняя память: обычно быстрее и меньше слева. Контроллер управляет устройством, драйвер — программный компонент ОС, шина связывает компоненты. Типичный путь I/O: приложение → API/syscall → ядро → драйвер → контроллер → устройство; детали зависят от ОС."], ["Классы ОС и ядро", "30 мин", "Классификация", "Мэйнфреймовые ОС рассчитаны на большие объёмы транзакций и I/O; серверные — на сетевые службы и нескольких пользователей; многопроцессорные распределяют работу по CPU; настольные ориентированы на пользователя; встроенные — на конкретное устройство и ограниченные ресурсы; ОС смарт-карт — на крайне ограниченное оборудование. RTOS обеспечивает предсказуемость сроков: hard deadline нельзя нарушить, soft допускает отдельные нарушения. Быстрый средний ответ не равен гарантии срока.", "Режимы", "User mode ограничивает привилегированные операции, kernel mode позволяет ядру управлять защитой и оборудованием. Запрещённая инструкция вызывает исключение. Системный вызов контролируемо переводит управление в ядро; после обработки возвращает его. Это переключение режима, но не обязательно переключение на другой поток.", "Архитектуры", "В лекции слои: аппаратная поддержка → машинно-зависимый слой → базовые механизмы → менеджеры ресурсов → интерфейс системных вызовов. Монолитное ядро держит многие службы в ядре; микроядро выносит больше служб в пользовательское пространство; гибрид сочетает идеи. GUI обычно работает поверх ядра."], ["Ресурсы ОС", "35 мин", "Классификация", "Ресурс — объект, используемый процессом и управляемый ОС. Физические: CPU, RAM, устройства, каналы; логические: файлы, сообщения, совместная память. Делимый ресурс допускает совместное использование; неделимый требует исключительного владения в конкретной ситуации. Ресурс можно разделять одновременно или попеременно; в PDF второе названо «параллельным распределением», но смысл — чередование.", "Вытеснение и квоты", "Вытесняемый ресурс можно отобрать и позже вернуть: CPU после сохранения контекста. Невытесняемый опасно отбирать без нарушения состояния: например, мьютекс или принтер в процессе операции. Квота ограничивает долю ресурса. Один и тот же объект может требовать разных правил доступа в разных сценариях.", "Управление", "Менеджер учитывает занятость, очередь и правила выдачи. Взаимное исключение защищает критический участок; starvation — длительное ожидание из-за распределения; deadlock — группа участников взаимно ждёт ресурсы и не может продолжить. Буфер сглаживает разницу скоростей, кэш хранит копии ради скорости, спулинг ставит задания устройства в очередь, например печать."], ["Процессы, потоки, прерывания", "60 мин", "Процесс и поток", "Программа — пассивный код; процесс — экземпляр выполнения с виртуальным адресным пространством, ресурсами и PID. PCB — запись ОС об управлении процессом, не сам процесс. Контекст включает состояние выполнения: регистры и счётчик команд. Потоки одного процесса разделяют память и открытые ресурсы, но имеют свои регистры, стек и счётчик команд. Пользовательские потоки управляются библиотекой, ядерные — ОС; смешанные модели совмещают их. Относительная стоимость зависит от реализации, фиксированного коэффициента нет.", "Состояния и переключение", "Ready → Running: диспетчер выделил CPU; Running → Ready: вытеснение; Running → Waiting: ожидание события; Waiting → Ready: событие наступило. Есть создание и завершение. В базовой схеме Waiting не переходит сразу в Running: сначала поток снова готов к выбору. Переключение контекста сохраняет состояние текущего и восстанавливает состояние выбранного потока, в том числе указатели команд и стека; переход в ядро сам по себе не обязан его вызывать.", "Прерывания", "Аппаратное прерывание приходит от таймера или устройства; исключение возникает синхронно при исполнении инструкции; программное инициируется инструкцией. Polling — периодический опрос. Учебная последовательность: фиксация → сохранение состояния → передача обработчику → дополнительное сохранение → обработка → восстановление → возврат. Реальная аппаратная детализация зависит от архитектуры. Приоритеты: относительные — текущий обработчик не прерывается; абсолютные — более приоритетный может прервать; LCFS — новый прерывает текущий. Маскирование ограничивает обработку некоторых сигналов."], ["Планирование CPU", "55 мин", "Планировщик и диспетчер", "В учебной лекции планировщик формирует состав задач, диспетчер выбирает готовую задачу. В распространённой терминологии краткосрочный планировщик выбирает поток, а диспетчер передаёт ему CPU. Долгосрочное планирование регулирует допуск задач; среднесрочное — выгрузку и возврат; краткосрочное — выбор готового потока.", "Метрики", "Загрузка CPU — доля занятого времени; throughput — число завершённых задач за период. Turnaround = завершение − прибытие; response = первый запуск − прибытие; waiting = turnaround − CPU burst в простой модели без I/O. Критерии конфликтуют: короткое среднее ожидание не гарантирует справедливости или хорошего отклика.", "Алгоритмы", "FCFS: очередь по прибытии, эффект конвоя. SJF: короткий burst первым, нужно прогнозировать длительность, длинные могут голодать. SRTF/SRT: выбирает наименьшее оставшееся время и вытесняет. Round Robin: очередь с квантом; маленький квант увеличивает накладные расходы, большой приближает к FCFS. Приоритетное: выбор по приоритету; starvation уменьшают aging — повышением приоритета ожидающих."], ["Модели выполнения", "35 мин", "Синхронность и ожидание", "Синхронный вызов обычно возвращает результат после завершения; асинхронный позволяет организовать продолжение позже. Блокирующее ожидание удерживает поток, неблокирующее позволяет ему заниматься другим. Async не означает автоматическое создание потока; операция может завершиться сразу. В C# await может освободить поток во время настоящего асинхронного I/O, но CPU-bound код сам по себе от async быстрее не станет.", "Конкурентность и параллелизм", "Конкурентность — задачи продвигаются в перекрывающиеся промежутки времени, возможно на одном ядре с чередованием. Параллелизм — физически одновременное выполнение, например потоков на двух ядрах. Многопоточность — несколько потоков, многопроцессорность — использование нескольких CPU/ядер. Общие данные требуют синхронизации. Affinity связывает или предпочитает CPU для потока; NUMA означает разную стоимость доступа к памяти в зависимости от расположения.", "Event loop", "Цикл получает готовые события и запускает обработчики; ожидание I/O часто делегируется ОС или инфраструктуре выполнения. Callback ставится в очередь механизмами среды, детали зависят от реализации. Долгий CPU-bound обработчик задерживает остальные события. I/O-bound ограничен ожиданием I/O, CPU-bound — вычислениями. Синхронность, потоки и параллелизм могут сочетаться."]], "qs": [[["Что является системным вызовом?", ["Контролируемый вход приложения в ядро", "Любая функция API", "Окно терминала"], 0, "API шире: не каждая функция API вызывает ядро."], ["Где обычно работает графическая оболочка?", ["В пользовательском режиме", "Всегда внутри ядра", "Только в BIOS"], 0, "Обычно GUI — приложение или набор пользовательских процессов."], ["Что хранит RSP на x86-64?", ["Указатель стека", "Таблицу файлов", "Температуру CPU"], 0, "RSP — регистр указателя стека."]], [["Что характеризует hard real-time?", ["Недопустимость нарушения дедлайна", "Максимальная средняя скорость", "Отсутствие ядра"], 0, "Главное — соблюдение временного ограничения."], ["Каждый системный вызов переключает процесс?", ["Нет", "Да", "Только в RTOS"], 0, "Переход режима может вернуться в тот же поток."], ["Какой класс ориентирован на сетевые службы?", ["Серверная ОС", "ОС смарт-карты", "Только настольная ОС"], 0, "Серверная ОС обслуживает сетевые и многопользовательские нагрузки."]], [["Чем тупик отличается от голодания?", ["При тупике участники взаимно ждут; при голодании одному долго не дают ресурс", "Это синонимы", "Голодание возможно только при отключении питания"], 0, "При starvation другие задачи могут продолжать работу."], ["Пример вытесняемого ресурса?", ["Процессорное время", "Мьютекс без безопасного восстановления", "Печатаемая страница"], 0, "Контекст позволяет прервать поток и возобновить позже."], ["Для чего спулинг?", ["Очередь заданий медленного устройства", "Шифрование RAM", "Компиляция ядра"], 0, "Например, очередь печати."]], [["Что имеют потоки одного процесса?", ["Общую память и собственные стеки", "Общий стек и разные адресные пространства", "Одинаковые регистры"], 0, "У каждого потока свой контекст и стек."], ["Куда переходит Waiting после события в базовой модели?", ["Ready", "Обязательно сразу Running", "Завершение"], 0, "После события поток становится готовым к выбору."], ["Каждое прерывание вызывает переключение контекста на другой поток?", ["Нет", "Да", "Только аппаратное"], 0, "Обработчик может вернуться к тому же потоку."]], [["Чем SRTF отличается от SJF?", ["Может вытеснить текущую задачу", "Всегда работает по кругу", "Не учитывает длительность"], 0, "SRTF выбирает минимальное оставшееся время."], ["Что даёт aging?", ["Повышает приоритет долго ожидающей задачи", "Уменьшает RAM", "Удаляет долгие задачи"], 0, "Это уменьшает риск голодания."], ["Слишком маленький квант RR?", ["Больше накладных расходов на переключения", "Всегда равен FCFS", "Исключает все задержки"], 0, "Слишком частые переключения занимают CPU."]], [["Нужен ли отдельный поток на всё ожидание каждого async I/O?", ["Не обязательно", "Всегда", "Только для await"], 0, "Настоящее асинхронное I/O может не занимать поток ожиданием."], ["Конкурентность возможна на одном ядре?", ["Да, с чередованием", "Нет", "Только на двух процессорах"], 0, "Одновременность продвижения не требует физической одновременности."], ["Что делает долгий обработчик event loop?", ["Задерживает другие события", "Ускоряет все I/O", "Автоматически создаёт ядро CPU"], 0, "Цикл не может обработать следующее событие, пока занят."]]]};let page=location.hash.slice(1)||'home';const store={get(k,d){try{return JSON.parse(localStorage.getItem('osnight-'+k))??d}catch{return d}},set(k,v){try{localStorage.setItem('osnight-'+k,JSON.stringify(v))}catch{}}};let cards=store.get('checks',{});const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(p){location.hash=p}window.addEventListener('hashchange',()=>{page=location.hash.slice(1)||'home';render();window.scrollTo(0,0)});function nav(){let tabs=[['home','Маршрут'],...DATA.sections.map((x,i)=>['l'+i,'0'+(i+1)]),['sim','CPU тренажёр'],['exam','Экзамен']];$('#nav').innerHTML=tabs.map(([p,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('')}
function render(){nav();if(page==='home')home();else if(/^l[0-5]$/.test(page))lecture(+page[1]);else if(page==='sim')sim();else if(page==='exam')exam();else home()}
function home(){$('#app').innerHTML=`<span class="tag">Старт здесь</span><h2>Учись активно, а не перечитывай</h2><p class="lead">Определение → назначение → механизм → пример → отличие. После каждого блока объясни тему вслух и проверь себя.</p><div class="note">Основа — приложенные первые 6 лекций и план. Конспект исправляет отдельные упрощения PDF; формулировки сверены с учебным планом. Переключение режима и потока — разные события.</div><div class="grid" style="margin-top:20px">${DATA.sections.map((s,i)=>`<div class="card"><span class="tag">Лекция 0${i+1} · ${s[1]}</span><h3>${s[0]}</h3><p>${s[2]} · ${s[4]} · ${s[6]}</p><button onclick="go('l${i}')">Открыть →</button></div>`).join('')}</div><div class="card"><h3>План на ночь</h3><p>Диагностика 15 мин → лекции 1–3 (40 + 30 + 35 мин) → лекции 4–6 (60 + 55 + 35 мин) → устный опрос 25 мин → письменная работа 25 мин → исправление ошибок 15 мин. Между блоками три перерыва по 10 минут. Всего 6 ч 05 мин.</p><p>Начни с вопросов: что такое ОС? режимы? ресурс? процесс и поток? планировщик и диспетчер? async и параллелизм? На ответ — до 90 секунд.</p><button onclick="go('exam')">Открыть экзаменатор →</button></div><p class="foot">Прогресс хранится локально в этом браузере и не синхронизируется между устройствами.</p>`}
function lecture(i){let s=DATA.sections[i];$('#app').innerHTML=`<span class="tag">Лекция 0${i+1} / 06 · ${s[1]}</span><h2>${s[0]}</h2><p class="muted">Прочитай блок, закрой экран и объясни содержание своими словами.</p>${[2,4,6].map(n=>`<div class="card"><h3>${s[n]}</h3><p>${s[n+1]}</p></div>`).join('')}<div class="card"><h3>Проверь себя</h3><div id="quiz"></div></div><div class="card"><h3>Вспомни без подсказки</h3><p id="prompt"></p><button onclick="showAnswer(${i})">Показать опорный ответ</button><div id="answer" class="hidden"><p>${s[3]}</p><p>${s[5]}</p></div></div><div class="card"><label><input type="checkbox" style="width:auto" ${cards[i]?'checked':''} onchange="cards[${i}]=this.checked;store.set('checks',cards)"> Могу объяснить эту лекцию без конспекта</label></div><div class="row"><button onclick="go('${i?'l'+(i-1):'home'}')">← Назад</button><button class="primary" onclick="go('${i<5?'l'+(i+1):'exam'}')">${i<5?'Следующая лекция':'К экзамену'} →</button></div>`;$('#prompt').textContent=['Назови шесть функций ОС и объясни путь системного вызова.','Сравни режимы, hard и soft real-time; назови классы ОС.','Классифицируй CPU, файл и мьютекс. Чем отличается тупик от голодания?','Нарисуй переходы состояний, сравни процесс с потоком и назови семь этапов прерывания.','Сравни пять алгоритмов, назови их недостатки и формулы времён.','Сравни async, конкурентность и параллелизм; объясни event loop.'][i];$('#quiz').innerHTML=DATA.qs[i].map((q,j)=>`<div id="q${j}"><p><b>${j+1}. ${q[0]}</b></p>${q[1].map((a,k)=>`<button class="choice" onclick="check(${i},${j},${k})">${a}</button>`).join('')}<p class="feedback" aria-live="polite"></p></div>`).join('')}
function check(i,j,k){let q=DATA.qs[i][j],el=$('#q'+j+' .feedback');el.className='feedback '+(k===q[2]?'good':'bad');el.textContent=(k===q[2]?'Верно. ':'Пока нет. ')+q[3]}function showAnswer(){$('#answer').classList.toggle('hidden')}
function sim(){$('#app').innerHTML=`<span class="tag">Практика / диаграмма Ганта</span><h2>Планировщик CPU</h2><p>Три процесса прибывают одновременно в порядке P1, P2, P3. Меняй CPU burst и алгоритм, затем рассчитай ожидание сам и сравни.</p><div class="card"><div class="row"><label>P1 burst<input id="p1" type="number" min="1" max="50" value="6"></label><label>P2 burst<input id="p2" type="number" min="1" max="50" value="3"></label><label>P3 burst<input id="p3" type="number" min="1" max="50" value="1"></label></div><label>Алгоритм<select id="alg"><option>FCFS</option><option>SJF</option><option>Round Robin</option></select></label><label>Квант RR<input id="quantum" type="number" min="1" max="50" value="2"></label><button class="primary" onclick="schedule()">Построить и проверить</button><div id="result" aria-live="polite"></div></div><div class="note">Модель: все поступают в момент 0, только один CPU burst, без I/O и стоимости переключения. При равенстве выбираем исходный порядок.</div><div class="card"><h3>Твоя задача</h3><p>Для P1=6, P2=3, P3=1 построй FCFS, SJF и RR с квантом 2. Найди ожидание каждого и среднее. Какие компромиссы меняются при другом кванте?</p><details><summary>Контрольные ответы</summary><p>FCFS: 0–6 P1, 6–9 P2, 9–10 P3; ожидание 0, 6, 9; среднее 5. SJF: P3, P2, P1; ожидание 4, 1, 0; среднее 1,67. RR: P1, P2, P3, P1, P2, P1; ожидание 4, 5, 4; среднее 4,33.</p><p>В плане среднее ожидание RR указано как ≈4; точное значение для этой модели — 13/3 ≈ 4,33.</p></details></div>`}
function schedule(){let bs=[1,2,3].map(n=>+$('#p'+n).value),q=+$('#quantum').value,alg=$('#alg').value;if(bs.some(v=>!Number.isInteger(v)||v<1||v>50)||!Number.isInteger(q)||q<1||q>50){$('#result').textContent='Введите целые числа от 1 до 50.';return}let rem=[...bs],end=[0,0,0],time=0,segments=[],queue=[0,1,2];if(alg==='SJF')queue.sort((a,b)=>bs[a]-bs[b]||a-b);while(queue.length){let id=queue.shift(),dt=alg==='Round Robin'?Math.min(q,rem[id]):rem[id];segments.push([id,time,time+dt]);time+=dt;rem[id]-=dt;if(rem[id])queue.push(id);else end[id]=time}let waits=end.map((x,i)=>x-bs[i]);$('#result').innerHTML=`<div class="gantt">${segments.map(x=>`<span>P${x[0]+1}<br>${x[1]}–${x[2]}</span>`).join('')}</div><p>Ожидание: ${waits.map((v,i)=>`P${i+1} = ${v}`).join(' · ')}<br>Среднее: <b>${(waits.reduce((a,b)=>a+b,0)/3).toFixed(2)}</b></p>`}
const oral=['Что такое ОС и какие шесть функций она выполняет?','Чем API отличается от системного вызова?','Почему RTOS не обязательно быстрее обычной ОС?','Когда системный вызов не вызывает переключения потока?','В чём разница голодания и тупика?','Чем отличается процесс от потока и PCB?','Расскажи переходы Ready, Running и Waiting.','Назови семь этапов прерывания.','Разница планировщика и диспетчера?','Сравни FCFS, SJF, SRTF, RR и приоритеты.','Почему маленький квант не всегда хорошо?','Как aging уменьшает голодание?','Почему async не означает дополнительный поток?','Разница concurrency и parallelism?','Почему CPU-bound обработчик задерживает event loop?'];let oi=0;function exam(){$('#app').innerHTML=`<span class="tag">Финальная проверка</span><h2>Режим экзаменатора</h2><p>Отвечай вслух 60–90 секунд: определение → назначение → механизм → пример → отличие. Оцени себя честно.</p><div class="card"><span id="oc" class="tag"></span><h3 id="oq"></h3><div class="row"><button onclick="oralMove(-1)">← Назад</button><button onclick="oralMove(1)">Следующий →</button></div><p>Самооценка:</p><div class="row"><button onclick="rate(0)">0 · не смог</button><button onclick="rate(1)">1 · пробелы</button><button onclick="rate(2)">2 · уверенно</button></div><p id="score" class="muted"></p></div><div class="card"><h3>Письменные билеты</h3><select id="ticket" onchange="ticket()"><option>Фундамент</option><option>Процессы</option><option>Ресурсы</option><option>Планирование</option><option>Выполнение</option></select><p id="tq"></p><textarea id="writing" placeholder="Напиши ответ по памяти. Черновик сохраняется на этом устройстве."></textarea><p class="foot">По одному баллу за определение, назначение, структуру, механизм и пример с нюансом. Два вопроса — максимум 10 баллов.</p></div><div class="card"><h3>Финальный чек-лист</h3>${['Шесть функций ОС и путь syscall','Режимы CPU и классификация ресурсов','Состояния процесса и семь этапов прерывания','Процесс, поток и переключение контекста','Пять алгоритмов и диаграмма Ганта','Async, concurrency и parallelism','Устный и письменный ответ по памяти'].map((x,i)=>`<label><input type="checkbox" style="width:auto" ${store.get('final'+i,false)?'checked':''} onchange="store.set('final${i}',this.checked)"> ${x}</label>`).join('')}</div>`;oralRender();ticket();$('#writing').addEventListener('input',()=>store.set('writing'+$('#ticket').selectedIndex,$('#writing').value))}
function oralRender(){$('#oc').textContent=`Вопрос ${oi+1} / ${oral.length}`;$('#oq').textContent=oral[oi];let scores=store.get('oral',{});$('#score').textContent=`Оценка: ${scores[oi]??'ещё не оценён'} · оценено ${Object.keys(scores).length} из ${oral.length}`}function oralMove(d){oi=(oi+d+oral.length)%oral.length;oralRender()}function rate(n){let s=store.get('oral',{});s[oi]=n;store.set('oral',s);oralRender()}function ticket(){let i=$('#ticket').selectedIndex;$('#tq').textContent=['1. Определи ОС, функции и задачи. 2. Классификация ОС, режимы и ядро.','1. Процесс и его состояния. 2. Потоки, контекст и прерывания.','1. Ресурсы и классификации. 2. Deadlock и starvation.','1. Планирование, диспетчеризация и метрики. 2. Сравни пять алгоритмов.','1. Синхронность, асинхронность и параллелизм. 2. Многопоточность и событийный цикл.'][i];$('#writing').value=store.get('writing'+i,'')};// Supplementary lessons: topic coverage, illustrations and exercises.
const extra=[
{map:[['Классификация ПО','Прикладное ПО решает задачи пользователя; системное обеспечивает работу системы; инструментальное создаёт программы. Границы условны.'],['Трансляторы','Компилятор преобразует код заранее, интерпретатор исполняет представление программы; JIT совмещает подходы. Ошибки могут обнаруживаться на разных этапах.'],['ОС, функции и задачи','Шесть функций: процессы, память, I/O, файлы, безопасность, сети. В терминологии лекции задачи — внешние результаты: интерфейс, запуск, абстракция, взаимодействие, обработка ошибок.'],['Операционная среда и абстракция','Набор сервисов, правил и интерфейсов для программ и людей. Абстракция скрывает подробности реализации: файл вместо команд диску.'],['GUI, CLI, терминал, API','GUI — визуальный интерфейс; CLI — командный; терминал предоставляет текстовый интерфейс, а shell интерпретирует команды. API — контракт программного взаимодействия.'],['CPU и регистры','АЛУ выполняет арифметические и логические операции, устройство управления координирует их. RIP указывает следующую инструкцию, RSP — стек, CR3 на x86-64 связан с таблицами страниц.'],['Память и устройства','Регистры, кэш, RAM и диск образуют иерархию. Контроллер работает с устройством, драйвер управляет им, шина соединяет компоненты.'],['Системный вызов','Приложение вызывает API, при необходимости выполняется контролируемый вход в ядро; ядро проверяет запрос и возвращает результат. Не каждый API требует системного вызова.']],practice:[['Графическая оболочка — ядро?','Обычно нет: она работает в пользовательском пространстве поверх ядра.'],['Почему нельзя напрямую управлять любым устройством?','Ограничение привилегий защищает систему и другие процессы; доступ предоставляется через контролируемые интерфейсы.'],['Почему компилятор и интерпретатор могут сочетаться?','Код можно сначала перевести в промежуточное представление, а затем интерпретировать или компилировать во время исполнения.'],['Как отличаются функция и задача ОС в лекции?','Функция — механизм управления; задача — предоставляемый результат.'],['Какие шесть функций ОС?','Процессы, память, ввод-вывод, файлы, безопасность, сеть.']]},
{map:[['Семь классов ОС','Мэйнфреймовые, серверные, многопроцессорные, настольные, реального времени, встроенные, смарт-карт. Классы могут пересекаться.'],['Hard и soft real-time','Hard: нарушение срока недопустимо по требованиям системы; soft: редкие нарушения ухудшают качество, но допустимы. Важна предсказуемость, а не только скорость.'],['Два режима CPU','User mode ограничивает привилегированные операции; kernel mode позволяет управлять оборудованием и защитой. Нарушение вызывает исключение.'],['Системный вызов и изоляция','Приложение передаёт управление ядру через контролируемый вход. Возврат в тот же поток возможен без переключения процесса.'],['Слоистое ядро','Аппаратная поддержка → машинно-зависимый слой → базовые механизмы → менеджеры ресурсов → интерфейс системных вызовов.'],['Типы архитектур','Монолитное: большинство служб в ядре; микроядро: больше служб вне ядра; гибридное сочетает подходы. Реальные реализации различаются.']],practice:[['Почему RTOS не обязана быть самой быстрой?','Требуется предсказуемость и соблюдение дедлайна, а не максимальная средняя производительность.'],['Что происходит при запрещённой инструкции?','Процессор генерирует исключение, ядро обрабатывает нарушение согласно политике ОС.'],['Каждый syscall переключает процесс?','Нет: меняется режим, а после обработки может продолжить тот же поток.'],['Зачем ядру привилегии?','Чтобы безопасно управлять аппаратурой, памятью и изоляцией процессов.']]},
{map:[['Физические и логические ресурсы','Физические: процессор, память, устройства; логические: файл, сообщение, программный объект. Ресурс — сущность, запрашиваемая процессом и управляемая ОС.'],['Делимые и неделимые','Совместное использование зависит от режима доступа. Несколько читателей файла возможны; запись может требовать исключительного доступа.'],['Одновременное и попеременное распределение','Несколько процессов могут одновременно занимать разные части RAM; один CPU чередует исполнение потоков.'],['Вытеснение и квоты','CPU можно отобрать с сохранением контекста; принудительное изъятие мьютекса опасно. Квоты ограничивают доли ресурсов.'],['Менеджер ресурсов','Ведёт учёт, управляет очередями, распределяет ресурсы и проверяет права/политику.'],['Взаимное исключение, starvation, deadlock','Взаимное исключение — не более одного владельца критического ресурса. Starvation — неопределённое ожидание. Deadlock — взаимное ожидание без прогресса.'],['Буфер, кэш и спулинг','Буфер сглаживает различия скоростей; кэш ускоряет повторный доступ; спулинг организует очередь заданий устройства, например принтера.']],practice:[['Является ли файл физическим ресурсом?','Файл — логический объект, хотя его данные размещаются на физическом носителе.'],['Почему нельзя просто забрать мьютекс?','Поток мог оставить общие данные в промежуточном некорректном состоянии.'],['В чём разница starvation и deadlock?','При starvation другие участники могут продвигаться; при deadlock группа взаимно ждёт и не может продолжить.'],['Почему CPU вытесняемый?','Состояние выполнения сохраняют, затем поток может продолжить позже.']]},
{map:[['Программа, процесс, PID, PCB','Программа — пассивный код; процесс — выполняемый экземпляр с ресурсами и виртуальным адресным пространством. PID идентифицирует процесс; PCB хранит управляющие сведения.'],['Контекст и память','Контекст содержит состояние исполнения, в том числе регистры и указатель команд. Процесс имеет виртуальное адресное пространство; ОС отображает его на физическую память.'],['Состояния процесса','Ready — готов, ждёт CPU; Running — выполняется; Waiting — ждёт события; также выделяют создание и завершение. Состояния часто точнее описывают отдельный поток.'],['Переходы','Ready → Running: выбор; Running → Ready: вытеснение; Running → Waiting: ожидание; Waiting → Ready: событие.'],['Процессы и потоки','У потоков общие адресное пространство и ресурсы процесса, но собственные регистры, стек и счётчик команд. Изоляция процессов выше; потоки проще обмениваются данными, но требуют синхронизации.'],['Пользовательские и ядерные потоки','Пользовательские планируются библиотекой; ядерные видит и планирует ОС. В моделях many-to-one блокирующий syscall способен заблокировать все такие потоки; зависит от реализации.'],['Переключение контекста','ОС сохраняет регистры текущего потока и восстанавливает регистры следующего, включая RIP/RSP на x86-64; возможно изменение адресного пространства. Это дороже простого вызова функции.'],['Прерывания, исключения и polling','Внешний сигнал приходит от устройства; исключение связано с инструкцией; программное прерывание вызвано инструкцией. Polling — периодический опрос вместо реакции на событие.'],['Семь этапов и приоритеты','Фиксация → сохранение → обработчик → дополнительное сохранение → обработка → восстановление → возврат. Относительные, абсолютные приоритеты и LCFS задают правила вложения; детали зависят от платформы.']],practice:[['Почему Ready ещё не Running?','Поток готов, но CPU пока занят другим или планировщик не выбрал его.'],['Может ли Waiting выполнять вычисления?','Заблокированный поток не выполняется; другой поток того же процесса может продолжать работу.'],['У трёх потоков общий стек?','Нет, стек и регистры каждого потока отдельные; адресное пространство общее.'],['Прерывание всегда переключает поток?','Нет: обработчик может вернуть управление тому же потоку.'],['Чем interrupt отличается от context switch?','Прерывание передаёт управление обработчику события; context switch меняет выполняемый контекст. Одно может привести к другому, но не обязательно.']]},
{map:[['Планировщик и диспетчер','В модели лекции планировщик формирует набор задач, диспетчер выбирает готовую. Часто в современной литературе scheduler выбирает поток, dispatcher выполняет передачу CPU.'],['Три уровня планирования','Долгосрочное допускает задачи; среднесрочное управляет выгрузкой/возвратом; краткосрочное выбирает готовый поток.'],['Пять показателей','Загрузка CPU и throughput стремятся увеличить; turnaround, waiting и response обычно стремятся уменьшить. Требования конфликтуют.'],['Формулы','При одном CPU burst и без I/O: turnaround=C−A; waiting=turnaround−B; response=S−A. A — прибытие, B — burst, C — завершение, S — первый запуск.'],['FCFS и SJF','FCFS следует очереди, но страдает эффектом конвоя. SJF выбирает минимальный burst, часто уменьшает среднее ожидание, но длительность нужно оценивать; длинные задачи могут голодать.'],['SRTF и Round Robin','SRTF — вытесняющий вариант по минимальному оставшемуся времени. RR циклически раздаёт кванты; маленький квант повышает расходы, большой приближает к FCFS.'],['Приоритет и aging','Статические приоритеты постоянны, динамические меняются. Aging повышает приоритет ожидающих и уменьшает риск starvation.']],practice:[['Чем планирование отличается от диспетчеризации?','Выбор следующего потока — решение планирования; передача ему CPU и восстановление контекста — диспетчеризация. В лекции используются близкие формулировки.'],['Почему SJF не всегда справедлив?','Длинный процесс может долго ждать, если постоянно поступают короткие.'],['Почему очень большой квант RR похож на FCFS?','Почти каждый процесс завершает свой burst до истечения кванта.'],['Почему нельзя оптимизировать всё одновременно?','Уменьшение ожидания, повышение справедливости и снижение расходов могут требовать разных решений.']]},
{map:[['Синхронность и асинхронность','Синхронный вызов обычно возвращает результат после завершения; асинхронный отделяет запуск операции от получения результата. Асинхронная операция может завершиться сразу.'],['Блокирующее и неблокирующее ожидание','При блокировке поток не может исполнять полезную работу; неблокирующая организация позволяет ему выполнять другую работу, пока операция ожидает.'],['Конкурентность и параллелизм','Конкурентность — перекрывающиеся интервалы продвижения задач; параллелизм — физическое одновременное выполнение. Конкурентность возможна на одном ядре.'],['Многопоточность и многопроцессорность','Несколько потоков могут делить память процесса; несколько CPU/ядер позволяют настоящую одновременность. Общие данные требуют синхронизации.'],['Affinity и NUMA','Affinity ограничивает или предпочитает выполнение потока на выбранных CPU. NUMA: доступ к памяти разных узлов может иметь разную стоимость.'],['Event loop, callback, I/O и CPU','Событийный цикл берёт готовые события и запускает обработчики; завершение I/O может поставить callback в очередь. Долгое CPU-bound вычисление задерживает цикл; I/O-bound чаще ждёт устройства или сеть.'],['Async/await в .NET','await может освободить поток на время настоящего асинхронного I/O; новый поток не гарантирован. CPU-bound код не становится параллельным автоматически.']],practice:[['Async всегда создаёт поток?','Нет. Модель ожидания и использование потоков — разные вопросы.'],['Возможен ли параллелизм внутри одного процесса?','Да: разные потоки могут одновременно работать на разных ядрах.'],['Почему event loop обслуживает много сетевых запросов?','Он обрабатывает готовые события и не обязан держать отдельный поток на каждом ожидании I/O.'],['Что будет при тяжёлом вычислении в обработчике?','Другие события ждут, пока обработчик не вернёт управление циклу.']]}
];
const addCSS=document.createElement('style');addCSS.textContent=`.flow{display:flex;gap:7px;flex-wrap:wrap;align-items:stretch;margin:14px 0}.flow span{background:#263c50;border:1px solid #57718a;border-radius:12px;padding:10px;flex:1;min-width:95px;text-align:center}.flow b{align-self:center;color:var(--a)}.statebtn{min-width:95px}.keylist details{padding:12px 0}.keylist summary{color:#dbeeff}.exercise{border:1px solid #52758a;background:#14263a;border-radius:15px;padding:16px;margin:14px 0}.exercise h4{margin:0 0 8px;color:#f7c76e}.tiny{font-size:13px;color:#aabbd0}.reveal{color:#aaf1dc}.exercise button{margin:3px}.termrow{display:flex;flex-wrap:wrap;gap:7px}.termrow span{background:#233a50;border-radius:8px;padding:5px 9px;font-size:13px}.vizbox{background:#101c2c;border-radius:13px;padding:16px}.stackbar{display:flex;flex-direction:column;gap:5px}.stackbar span{padding:7px 12px;border-radius:8px;background:#284860}.diagramtext{font-size:13px;fill:#e8f3fa}.diagstroke{fill:#1d3d52;stroke:#6ae1c4;stroke-width:2}`;document.head.appendChild(addCSS);
const diagrams=[`<div class="flow"><span>Приложение<br><small>user mode</small></span><b>→</b><span>API / syscall</span><b>→</b><span>Ядро</span><b>→</b><span>Драйвер</span><b>→</b><span>Устройство</span></div><p class="tiny">Типичный путь I/O: отдельные API не вызывают ядро, детали зависят от устройства.</p><div class="flow"><span>Регистры</span><b>→</b><span>Кэш</span><b>→</b><span>RAM</span><b>→</b><span>Диск</span></div><p class="tiny">Слева направо обычно растёт объём и задержка.</p>`,
`<div class="stackbar"><span>5 · Интерфейс системных вызовов</span><span>4 · Менеджеры ресурсов</span><span>3 · Базовые механизмы</span><span>2 · Машинно-зависимый слой</span><span>1 · Аппаратная поддержка</span></div><p class="tiny">Сверху — интерфейс приложения, снизу — опора на аппаратуру.</p>`,
`<div class="flow"><span>Процесс запрашивает</span><b>→</b><span>Менеджер проверяет</span><b>→</b><span>Выдача / очередь</span><b>→</b><span>Освобождение</span></div><div class="flow"><span>Буфер<br><small>сглаживает скорость</small></span><span>Кэш<br><small>ускоряет повторы</small></span><span>Спулинг<br><small>очередь заданий</small></span></div>`,
`<svg viewBox="0 0 360 210" role="img" aria-label="Переходы между готовностью, выполнением и ожиданием" style="width:100%;max-height:260px"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#9ab8c7"/></marker></defs><rect x="12" y="20" width="95" height="45" rx="12" class="diagstroke"/><rect x="250" y="20" width="95" height="45" rx="12" class="diagstroke"/><rect x="130" y="150" width="100" height="45" rx="12" class="diagstroke"/><text x="59" y="48" text-anchor="middle" class="diagramtext">Ready</text><text x="297" y="48" text-anchor="middle" class="diagramtext">Running</text><text x="180" y="178" text-anchor="middle" class="diagramtext">Waiting</text><g fill="none" stroke="#9ab8c7" stroke-width="2" marker-end="url(#arrow)"><path d="M110 32 H247"/><path d="M248 55 H110"/><path d="M290 68 Q286 118 225 152"/><path d="M130 166 Q42 143 53 69"/></g><g fill="#c5dce8" font-size="10"><text x="150" y="25">выбор</text><text x="145" y="69">вытеснение</text><text x="266" y="120">ожидание I/O</text><text x="27" y="126">событие</text></g></svg>`,
`<div class="flow"><span>Очередь Ready</span><b>→</b><span>Выбор<br><small>планировщик</small></span><b>→</b><span>Передача CPU<br><small>диспетчер</small></span><b>→</b><span>Выполнение</span></div><p class="tiny">Завершение, ожидание или вытеснение вызывают новый выбор.</p>`,
`<div class="flow"><span>Запрос I/O</span><b>→</b><span>Ожидание вне потока</span><b>→</b><span>Событие готовности</span><b>→</b><span>Очередь</span><b>→</b><span>Обработчик</span></div><p class="tiny">Это типовая модель; конкретная организация зависит от среды выполнения.</p>`];
const originalLecture=lecture;lecture=function(i){originalLecture(i);let app=$('#app');let insert=document.createElement('section');insert.innerHTML=`<div class="card"><span class="tag">Карта темы · ${extra[i].map.length} пунктов</span><h3>Визуальная опора</h3><div class="vizbox">${diagrams[i]}</div><h3>Все пункты блока по плану</h3><p class="tiny">Нажми на пункт, объясни его самостоятельно, затем открой проверку.</p><div class="keylist">${extra[i].map.map(([a,b])=>`<details><summary>${a}</summary><p>${b}</p></details>`).join('')}</div></div><div class="card"><span class="tag">Активное воспроизведение</span><h3>Вопросы с подвохом</h3><p>Отвечай вслух до открытия ответа. Если ответил частично — вернись к теме.</p><div class="keylist">${extra[i].practice.map(([a,b])=>`<details><summary>${a}</summary><p class="reveal">${b}</p></details>`).join('')}</div></div><div class="card"><span class="tag">Интерактивный тренажёр</span><h3>${['Собери цепочку I/O','Распознай ситуацию RTOS','Классифицируй ресурс','Машина состояний','Узнай алгоритм','Различай модели'][i]}</h3><div id="special"></div></div>`;app.insertBefore(insert,app.querySelector('.row:last-child'));special(i)};
function special(i){const root=$('#special');if(i===0){orderGame(root,['Приложение','Системный вызов','Ядро','Драйвер','Устройство'],'Собери упрощённый путь запроса от программы к оборудованию.')}else if(i===1){choiceGame(root,[['Датчик обязан отреагировать до жёсткого срока, пропуск недопустим.','Hard real-time','Hard real-time','Soft real-time','Обычная пакетная обработка'],['Редкое опоздание видеокадра ухудшает качество, но допустимо.','Soft real-time','Hard real-time','Soft real-time','Гарантированный hard deadline'],['Средняя задержка мала, но иногда неограниченно велика.','Не гарантирует real-time','Гарантирует hard deadline','Не гарантирует real-time','Обязательно микроядро']])}else if(i===2){choiceGame(root,[['Файл по природе — это…','Логический ресурс','Физический ресурс','Логический ресурс','Регистр процессора'],['CPU time при сохранении контекста — …','Вытесняемый','Невытесняемый','Вытесняемый','Только логический файл'],['Поток бесконечно ждёт, пока другие получают ресурс.','Starvation','Deadlock','Starvation','Буферизация'],['A держит X и ждёт Y; B держит Y и ждёт X.','Deadlock','Starvation','Deadlock','Кэширование']])}else if(i===3){root.innerHTML='<p>Текущее состояние: <strong id="state">Ready</strong>. Выбери событие и проверь переход.</p><div id="statebuttons" class="row"></div><p id="statemsg" class="reveal"></p><hr><h4>Порядок обработки прерывания</h4><div id="interruptOrder"></div>';stateGame('Ready');orderGame($('#interruptOrder'),['Фиксация','Сохранение состояния','Передача обработчику','Дополнительное сохранение','Обработка','Восстановление','Возврат'],'Нажимай этапы по порядку из лекции.')}else if(i===4){choiceGame(root,[['Короткая задача прерывает текущую при меньшем оставшемся времени.','SRTF','FCFS','SRTF','Round Robin'],['Каждому готовому выдаётся квант по кругу.','Round Robin','SJF','Round Robin','FCFS'],['Сначала пришёл — первым обслужен.','FCFS','FCFS','SJF','SRTF'],['Самая короткая задача выбирается без вытеснения.','SJF','Priority','SJF','Round Robin'],['Ожидающим постепенно повышают приоритет.','Aging','Конвой','Aging','Polling']]);root.insertAdjacentHTML('beforeend',`<p><button onclick="go('sim')">Перейти к диаграммам Ганта →</button></p>`)}else{choiceGame(root,[['Два потока чередуются на одном ядре.','Конкурентность','Только параллелизм','Конкурентность','Ни то ни другое'],['Два вычисления одновременно выполняются на разных ядрах.','Параллелизм','Только блокировка','Параллелизм','Только callback'],['await сетевого запроса без занятого потока ожидания.','Асинхронное I/O','Обязательно новый поток','Асинхронное I/O','Только CPU-bound'],['Долгий расчёт в обработчике event loop.','Задерживает очередь','Задерживает очередь','Автоматически запускает второе ядро','Не влияет на другие события']])}}
function orderGame(root,answer,instruction){let pool=answer.slice().reverse(),chosen=[];function paint(){root.innerHTML=`<p>${instruction}</p><p class="tiny">Твой порядок: ${chosen.length?chosen.map(esc).join(' → '):'пока пусто'}</p><div>${pool.map((x,i)=>`<button data-n="${i}">${esc(x)}</button>`).join('')}</div><p id="orderMessage" aria-live="polite"></p><button data-reset>Начать заново</button>`;root.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{let n=+b.dataset.n;chosen.push(pool.splice(n,1)[0]);paint();if(!pool.length){let ok=chosen.every((x,i)=>x===answer[i]);root.querySelector('#orderMessage').textContent=ok?'Верно!':'Порядок неверный. Правильно: '+answer.join(' → ');root.querySelector('#orderMessage').className=ok?'good':'bad'}});root.querySelector('[data-reset]').onclick=()=>{pool=answer.slice().reverse();chosen=[];paint()}}paint()}
function choiceGame(root,items){let index=0;function paint(){let x=items[index];root.innerHTML=`<p class="tiny">Ситуация ${index+1} / ${items.length}</p><p><b>${x[0]}</b></p><div>${x.slice(2).map((v,i)=>`<button data-choice="${i}">${v}</button>`).join('')}</div><p id="casefeedback" aria-live="polite"></p><button data-next>Следующая ситуация →</button>`;root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let ok=b.textContent===x[1],e=root.querySelector('#casefeedback');e.textContent=ok?'Верно!':'Попробуй ещё раз.';e.className=ok?'good':'bad'});root.querySelector('[data-next]').onclick=()=>{index=(index+1)%items.length;paint()}}paint()}
function stateGame(state){$('#state').textContent=state;let opts=[['Выбран планировщиком','Ready','Running'],['Вытеснен','Running','Ready'],['Ждёт I/O','Running','Waiting'],['Событие завершилось','Waiting','Ready']];$('#statebuttons').innerHTML=opts.map((x,i)=>`<button class="statebtn" onclick="stateClick('${state}',${i})">${x[0]}</button>`).join('')}
function stateClick(s,i){let ops=[['Ready','Running'],['Running','Ready'],['Running','Waiting'],['Waiting','Ready']],o=ops[i];if(s!==o[0]){$('#statemsg').textContent='Этот переход неприменим к текущему состоянию. Выбери другое событие.';return}stateGame(o[1]);$('#statemsg').textContent=`${o[0]} → ${o[1]}: переход выполнен.`}

render();</script></body></html>
