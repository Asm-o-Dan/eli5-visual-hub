let cpuTrace=[],cpuTasks=[],cpuPos=0;sim=function(){$('#app').innerHTML=`<span class="tag">Практика / планирование</span><h2>Построй диаграмму CPU</h2><p>Введи задачи и выбери алгоритм. В режиме решения выбирай, кто работает на каждом такте, затем вычисли три метрики для каждого процесса.</p><div class="card"><div class="tiny">Приоритет: меньшее число означает более высокий. При равенстве — порядок ввода. Все времена — целые от 0 до 30, burst от 1 до 20.</div><div id="taskinputs">${[0,1,2].map((i)=>`<div class="row"><label>P${i+1} прибытие<input type="number" id="a${i}" min="0" max="30" value="${[0,1,2][i]}"></label><label>burst<input type="number" id="b${i}" min="1" max="20" value="${[6,3,1][i]}"></label><label>приоритет<input type="number" id="pr${i}" min="0" max="30" value="${[2,1,3][i]}"></label></div>`).join('')}</div><label>Алгоритм<select id="alg"><option>FCFS</option><option>SJF</option><option>SRTF</option><option>Round Robin</option><option>Priority</option></select></label><label>Квант RR<input id="quantum" type="number" min="1" max="20" value="2"></label><p class="tiny">FCFS/SJF/Priority — без вытеснения. SRTF — с вытеснением. При равенстве SRTF текущий процесс продолжает выполняться. В RR новые поступления на границе кванта попадают в очередь раньше вытесненного процесса. Накладные расходы = 0.</p><button class="primary" onclick="cpuInit()">Начать решение</button><div id="cpuGame"></div></div><div class="card"><h3>Как считать</h3><p>Turnaround = C − A; waiting = C − A − B; response = S − A, где A — прибытие, B — длительность, S — первый запуск, C — завершение. Подходит для модели с одним CPU burst и без I/O.</p></div>`};
function cpuInit(){let tasks=[0,1,2].map(i=>({id:i,a:+$('#a'+i).value,b:+$('#b'+i).value,p:+$('#pr'+i).value})),quantum=+$('#quantum').value,alg=$('#alg').value;if(tasks.some(t=>!Number.isInteger(t.a)||t.a<0||t.a>30||!Number.isInteger(t.b)||t.b<1||t.b>20||!Number.isInteger(t.p)||t.p<0||t.p>30)||!Number.isInteger(quantum)||quantum<1||quantum>20){$('#cpuGame').innerHTML='<p class="bad">Проверь диапазоны и целочисленные значения.</p>';return}cpuTasks=tasks;cpuTrace=makeTrace(tasks,alg,quantum);cpuPos=0;cpuPaint()}
function makeTrace(tasks,alg,quantum){let ps=tasks.map(t=>({...t,r:t.b})),time=0,trace=[],queue=[],current=null,slice=0,completed=0;while(completed<ps.length){let arrivals=ps.filter(p=>p.a===time).sort((a,b)=>a.id-b.id);if(alg==='Round Robin'){arrivals.forEach(p=>queue.push(p));if(current&&current.r>0&&slice===quantum){queue.push(current);current=null;slice=0}if(!current&&queue.length){current=queue.shift();slice=0}}else{let ready=ps.filter(p=>p.a<=time&&p.r>0);if(alg==='SRTF'){ready.sort((a,b)=>a.r-b.r||(a===current?-1:b===current?1:a.a-b.a||a.id-b.id));current=ready[0]||null}else if(!current&&ready.length){ready.sort((a,b)=>alg==='FCFS'?a.a-b.a||a.id-b.id:alg==='SJF'?a.b-b.b||a.a-b.a||a.id-b.id:a.p-b.p||a.a-b.a||a.id-b.id);current=ready[0]}}let id=current?.id??-1;trace.push({time,id});if(current){current.r--;slice++;if(current.r===0){completed++;current=null;slice=0}}time++;if(time>200)throw Error('CPU trace limit')}return trace}
function cpuPaint(){let done=cpuPos===cpuTrace.length;let hist=cpuTrace.slice(0,cpuPos).map(x=>`<span>${x.id<0?'Простой':'P'+(x.id+1)}<br>${x.time}–${x.time+1}</span>`).join('');$('#cpuGame').innerHTML=`<h3>Твой маршрут</h3><div class="gantt">${hist||'<span>Пока пусто</span>'}</div>${done?'<p class="good">Диаграмма построена. Теперь рассчитай метрики.</p><div id="metrics"></div>':`<p>Время <b>${cpuPos}</b>. Кто должен получить CPU на интервал [${cpuPos}; ${cpuPos+1})?</p><div class="row">${cpuTasks.map(x=>`<button onclick="cpuChoose(${x.id})">P${x.id+1}</button>`).join('')}<button onclick="cpuChoose(-1)">Простой</button></div><p id="cpufeed" aria-live="polite"></p><button onclick="cpuHint()">Подсказка</button>`}`;if(done)cpuMetrics()}
function cpuChoose(id){let x=cpuTrace[cpuPos];if(id!==x.id){$('#cpufeed').className='bad';$('#cpufeed').textContent='Не подходит по правилу алгоритма. Проверь поступившие процессы, остаток и очередь. Попробуй снова.';return}cpuPos++;cpuPaint()}
function cpuHint(){let x=cpuTrace[cpuPos];$('#cpufeed').className='reveal';$('#cpufeed').textContent=`На этом шаге: ${x.id<0?'простой, готовых процессов нет':'P'+(x.id+1)}. Сверь выбор с правилом алгоритма и предыдущими шагами.`}
function cpuMetrics(){let rows=cpuTasks.map(p=>{let slots=cpuTrace.filter(x=>x.id===p.id),start=slots[0].time,end=slots.at(-1).time+1;return {...p,start,end,turn:end-p.a,wait:end-p.a-p.b,resp:start-p.a}});$('#metrics').innerHTML=rows.map(p=>`<div class="exercise"><h4>P${p.id+1}: A=${p.a}, B=${p.b}</h4><div class="row"><label>Turnaround<input id="t${p.id}" type="number"></label><label>Waiting<input id="w${p.id}" type="number"></label><label>Response<input id="r${p.id}" type="number"></label></div><button onclick="cpuCheckMetric(${p.id},${p.start},${p.end},${p.turn},${p.wait},${p.resp})">Проверить</button><p id="m${p.id}"></p><details><summary>Показать пошаговый расчёт</summary><p>S=${p.start}; C=${p.end}. Turnaround=${p.end}−${p.a}=${p.turn}; waiting=${p.turn}−${p.b}=${p.wait}; response=${p.start}−${p.a}=${p.resp}.</p></details></div>`).join('')+`<details><summary>Средние значения</summary><p>Turnaround: ${(rows.reduce((s,p)=>s+p.turn,0)/3).toFixed(2)}; waiting: ${(rows.reduce((s,p)=>s+p.wait,0)/3).toFixed(2)}; response: ${(rows.reduce((s,p)=>s+p.resp,0)/3).toFixed(2)}.</p></details>`}
function cpuCheckMetric(i,s,c,t,w,r){let values=['t','w','r'].map(x=>$('#'+x+i).value),expected=[t,w,r],labels=['Turnaround','Waiting','Response'];$('#m'+i).innerHTML=labels.map((x,j)=>`<span class="${values[j]!==''&&+values[j]===expected[j]?'good':'bad'}">${x}: ${values[j]!==''&&+values[j]===expected[j]?'верно':'проверь'}</span>`).join(' · ')}
const originalHome=home;home=function(){originalHome();let box=document.createElement('div');box.className='card';box.innerHTML=`<span class="tag">Ночной режим</span><h3>Таймер блока</h3><p>Выбери этап и запусти таймер. Чтобы пропустить освоенную тему, просто выбери следующий этап. Таймер не работает в фоне после закрытия страницы.</p><label>Этап<select id="timerStage"><option value="15">Входная диагностика · 15 мин</option><option value="40">Лекция 1 · 40 мин</option><option value="30">Лекция 2 · 30 мин</option><option value="10">Перерыв · 10 мин</option><option value="35">Лекция 3 · 35 мин</option><option value="60">Лекция 4 · 60 мин</option><option value="10">Перерыв · 10 мин</option><option value="55">Лекция 5 · 55 мин</option><option value="35">Лекция 6 · 35 мин</option><option value="10">Перерыв · 10 мин</option><option value="25">Устный опрос · 25 мин</option><option value="25">Письменная работа · 25 мин</option><option value="15">Исправление пробелов · 15 мин</option></select></label><p id="timerDisplay" style="font-size:28px;font-weight:700">15:00</p><div class="row"><button id="timerStart" class="primary">Начать</button><button id="timerStop">Остановить</button></div>`;$('#app').appendChild(box);let interval=null,end=0;let select=$('#timerStage'),display=$('#timerDisplay');function reset(){clearInterval(interval);interval=null;display.textContent=select.value+':00'}select.onchange=reset;$('#timerStop').onclick=reset;$('#timerStart').onclick=()=>{clearInterval(interval);end=Date.now()+Number(select.value)*60000;function tick(){let left=Math.max(0,Math.ceil((end-Date.now())/1000));if(!document.contains(display)){clearInterval(interval);return}display.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(!left){clearInterval(interval);display.textContent='Время вышло — проверь результат блока'}}tick();interval=setInterval(tick,1000)}};

const guided=[
[
['8 мин','ПО и трансляция','Компьютер состоит из аппаратуры и программ. Аппаратура исполняет инструкции и хранит данные, но сама по себе не знает, какую задачу решать. ПО задаёт эти действия. Прикладное ПО решает задачу человека: браузер отображает страницы, редактор изменяет документы. Системное ПО организует работу машины: ОС, драйверы и системные службы. Инструментальное ПО помогает разработчику создать другое ПО: компилятор, отладчик, IDE. Одна программа может выполнять несколько ролей.','Процессор не исполняет C# напрямую. Транслятор переводит код между представлениями. Компилятор заранее преобразует исходный код в другой код; интерпретатор выполняет инструкции исходного или промежуточного представления во время работы. В .NET C# обычно компилируется в IL, а JIT во время выполнения переводит нужные участки IL в машинный код. Поэтому компиляция и интерпретация — подходы, которые можно сочетать.','C# → компилятор → IL → JIT → машинные инструкции','Почему IDE, браузер и ядро относятся к разным группам?','Сравни их назначение: создание ПО, решение пользовательской задачи и управление работой системы.'],
['12 мин','Что делает ОС и зачем нужны абстракции','ОС — комплекс программ, управляющий аппаратными и программными ресурсами и предоставляющий среду выполнения приложений. Представь два приложения, одновременно желающих читать диск. Без арбитра они могли бы конфликтовать. ОС распределяет доступ, изолирует процессы и предоставляет согласованные интерфейсы.','В лекции функции — внутренние направления работы: процессы, память, устройства ввода-вывода, файлы, безопасность, сеть. Задачи — результаты для пользователя и программы: запуск приложений, интерфейс, абстракция оборудования, взаимодействие и обработка ошибок. Например, управление файловой системой — функция; возможность удобно сохранить документ — результат.','Приложение → интерфейс ОС → управление ресурсами → оборудование','Почему файл — абстракция?','Приложение работает с именем и содержимым файла, не управляя напрямую конкретными секторами накопителя.'],
['10 мин','Интерфейсы и устройство компьютера','Операционная среда — предоставляемые ОС сервисы, правила и интерфейсы. GUI использует окна и кнопки. CLI принимает текстовые команды; терминал предоставляет текстовое окно, а shell, например PowerShell или Bash, разбирает и выполняет команды. API — договор для программ: какие функции доступны, какие аргументы и результат они имеют.','CPU включает устройство управления, АЛУ и регистры. Устройство управления организует выполнение инструкций; АЛУ выполняет арифметические и логические операции. Регистры — очень быстрые небольшие ячейки: RIP на x86-64 связан с адресом следующей инструкции, RSP указывает на стек, CR3 связан с таблицами страниц. Регистры и кэш меньше и обычно быстрее RAM; накопитель хранит данные долговременно. Контроллер управляет устройством, драйвер предоставляет ядру способ с ним работать, шина соединяет компоненты.','Регистры → кэш → RAM → накопитель','Чем терминал отличается от shell?','Терминал предоставляет интерфейс, а shell интерпретирует команды; они могут работать вместе.'],
['5 мин','User mode и kernel mode: зачем два режима','Программа запускается в пользовательском режиме (user mode): процессор ограничивает доступные привилегированные операции. Например, обычное приложение не должно самостоятельно менять таблицы защиты памяти или произвольно управлять устройством. Иначе ошибка одного приложения могла бы повредить ядро, чужую память или данные. Защиту обеспечивает сочетание режимов CPU, механизмов памяти и проверок ОС.','Ядро выполняется в привилегированном режиме (kernel mode): ему доступны операции управления памятью и оборудованием. Когда приложению нужен файл, оно обращается к API; библиотека при необходимости подготавливает системный вызов. Специальная инструкция переводит CPU в режим ядра и передаёт управление по предусмотренной точке входа. Ядро проверяет аргументы и права, выполняет запрос или организует ожидание, затем возвращает результат в user mode. Попытка пользовательского кода выполнить запрещённую инструкцию вызывает исключение.','User: запрос → контролируемый вход → Kernel: проверка → возврат в User','Меняется ли процесс при каждом syscall?','Нет. Меняется режим CPU; ядро может вернуться в тот же поток. Если поток ждёт I/O или вытеснен, планировщик может выбрать другой.'],
['5 мин','Самопроверка','Закрой объяснение. Дай определение ОС, перечисли шесть функций и опиши путь запроса файла. Затем различи GUI, CLI, API и системный вызов.','Оцени себя: можешь ли объяснить, зачем режимы разделены, а не просто назвать их? Если нет — вернись к предыдущему шагу.','Определение → назначение → механизм → пример → отличие','Почему ядро проверяет аргументы запроса?','Пользовательская программа может ошибаться или передать недопустимые данные; ядро защищает систему и соблюдает права доступа.']
],
[
['8 мин','Классы операционных систем','Классы выделяют по требованиям нагрузки. Мэйнфреймы, например z/OS, обслуживают большие объёмы транзакций. Серверные ОС, например Linux и Windows Server, предоставляют сетевые службы и обслуживают пользователей. Многопроцессорные системы распределяют потоки между CPU. Настольные ОС ориентированы на интерактивную работу.','Встроенные ОС работают внутри специализированных устройств; ОС смарт-карт рассчитаны на очень ограниченные ресурсы. Классы не взаимоисключающие: Linux может быть серверным, встроенным и многопроцессорным.','Нагрузка → требования → выбор ОС','Почему одну ОС можно отнести к нескольким классам?','Классификации описывают разные свойства и сценарии, которые могут пересекаться.'],
['7 мин','Реальное время и дедлайн','В системе реального времени правильность результата зависит не только от значения, но и от времени получения. Дедлайн — крайний срок реакции. Например, управление оборудованием может требовать обработать сигнал до определённого момента.','Hard real-time: нарушение дедлайна недопустимо по требованиям задачи. Soft real-time: отдельные опоздания допустимы, но ухудшают качество, как задержка видеокадра. Обычная ОС может иметь более низкую среднюю задержку, но без гарантии максимальной; поэтому RTOS не обязательно быстрее в среднем.','Событие → обработка → дедлайн','Почему малое среднее время ответа не гарантирует hard real-time?','Отдельный редкий ответ может оказаться слишком поздним; важна гарантия ограничения задержки.'],
['7 мин','Два режима и системный вызов','Режим задаётся состоянием процессора. В user mode запрещены привилегированные инструкции и прямое изменение критических механизмов. Ядро выполняет такие действия в kernel mode. Это граница защиты, а не два разных процесса и не две разные программы.','При системном вызове процессор входит в ядро через контролируемую точку. Ядро проверяет запрос и права, затем выполняет работу. Режим меняется, но поток может остаться тем же. Если операция требует ждать устройство, поток может перейти в Waiting, а другой получить CPU.','User → syscall → Kernel → проверка → User','Что изменится, если поток ждёт завершения чтения диска?','Он может блокироваться; планировщик выбирает другой готовый поток, затем после события ожидающий становится готовым.'],
['4 мин','Слои и архитектуры ядра','Снизу находятся аппаратная поддержка и машинно-зависимые компоненты, выше — базовые механизмы, менеджеры ресурсов и интерфейс вызовов. Слои разделяют обязанности и скрывают особенности платформы.','Монолитное ядро размещает многие службы в пространстве ядра: взаимодействие быстрое, но ошибка компонента опасна для всей системы. Микроядро оставляет внутри минимум механизмов, а больше служб выносит в пользовательские процессы: изоляция выше, но обмен сообщениями может стоить времени. Гибрид сочетает подходы.','Аппаратура → механизмы → менеджеры → вызовы','Почему сбой драйвера в ядре может быть опаснее сбоя отдельной службы?','Код ядра имеет высокие привилегии и общий критический контекст; сбой способен затронуть всю систему.'],
['4 мин','Самопроверка','Назови семь классов ОС, сравни hard и soft real-time, объясни переход в ядро и обратно.','Нарисуй слои ядра и сравни две архитектуры с их компромиссами.','Класс → требование → пример','Почему GUI не обязательно часть ядра?','Графическая оболочка обычно работает как пользовательское приложение, используя сервисы ядра.']
],
[
['7 мин','Физические и логические ресурсы','Ресурс — объект, который процесс может запросить и использовать. ОС учитывает доступ, права и занятость. Процессорное время, RAM, диск и устройство относятся к физическим ресурсам; файл, сообщение или программный объект — к логическим.','Файл хранится на физическом носителе, но сам файл — логическая абстракция. Различай объект и оборудование, которое обеспечивает его хранение.','Процесс → запрос → менеджер ресурсов','Файл физический или логический?','Логический; его данные физически размещены на носителе.'],
['7 мин','Совместное и попеременное использование','Делимый ресурс допускает совместное использование при соблюдении правил. Разные процессы могут занимать разные области RAM. Неделимый ресурс в конкретной ситуации требует одного владельца: например, критическая секция защищена мьютексом.','Совместимость зависит от операции: несколько процессов могут читать файл одновременно, но запись может требовать координации. Один CPU распределяет время попеременно: очень быстрые переключения создают видимость одновременного выполнения.','RAM: A и B одновременно · CPU: A → B → A','Всегда ли файл либо делимый, либо неделимый?','Нет, зависит от операций и протокола доступа: совместное чтение и эксклюзивная запись имеют разные требования.'],
['8 мин','Вытеснение и квоты','Вытесняемый ресурс можно изъять и затем безопасно возобновить использование. CPU обычно отбирают после сохранения контекста потока. Невытесняемый ресурс нельзя просто отобрать без риска нарушения состояния.','Если забрать мьютекс у потока во время изменения общей структуры данных, другой поток может увидеть её в некорректном состоянии. Квота задаёт ограничение доли: например, лимит дискового пространства или процессорного времени в рамках определённой политики.','CPU: сохранить → вытеснить → восстановить','Почему нельзя просто отобрать мьютекс?','Поток может находиться посреди изменения общих данных; нужна предусмотренная механизмом стратегия восстановления.'],
['7 мин','Очереди, deadlock и starvation','Менеджер ресурсов отслеживает владельцев и обрабатывает запросы: выдаёт ресурс, отклоняет запрос или ставит его в очередь. Взаимное исключение означает, что критический ресурс в данный момент принадлежит одному участнику.','Deadlock: A держит X и ждёт Y, B держит Y и ждёт X; никто не продолжает без внешнего изменения. Starvation: участник очень долго не получает ресурс, хотя другие продолжают работать. Единый порядок захвата уменьшает риск циклического ожидания. Буфер сглаживает скорости, кэш ускоряет повторное чтение, спулинг хранит очередь заданий принтеру.','A держит X → ждёт Y · B держит Y → ждёт X','При starvation другие процессы обязательно остановлены?','Нет. Именно другие могут продолжать получать ресурс, пока один процесс неопределённо долго ждёт.'],
['6 мин','Самопроверка','Составь таблицу: физический/логический, делимый/неделимый, вытесняемый/невытесняемый. Для каждой категории приведи пример и условие, при котором он верен.','Объясни разницу deadlock и starvation и сравни буфер, кэш и спулинг.','Категория → пример → почему','CPU физический, но почему время CPU называют ресурсом?','Время выполнения на физическом CPU ограничено и распределяется между задачами.']
],
[
['12 мин','Программа, процесс и PCB','Программа — пассивный набор инструкций. Когда ОС запускает её, возникает процесс: экземпляр выполнения со своим виртуальным адресным пространством, ресурсами и идентификатором PID. В памяти располагаются код, данные и другие области; ресурсы включают открытые файлы.','PCB — управляющая запись ОС с данными о процессе, а не сам процесс. Контекст содержит состояние, необходимое для продолжения исполнения. Родитель может создать дочерний процесс; конкретные операции управления зависят от механизмов и прав ОС.','Программа → запуск → процесс + PID + ресурсы','Почему два запуска одной программы — два процесса?','Это разные экземпляры выполнения с отдельным управляемым состоянием и ресурсами.'],
['13 мин','Пассивное и активные состояния','В модели лекции пассивный процесс известен системе, но не претендует на ресурсы. Активный конкурирует за ресурсы. Ready означает: поток готов и ждёт CPU; Running — исполняется; Waiting — ожидает событие, например завершение I/O. Реальные ОС имеют более подробные модели и часто учитывают состояния на уровне потоков.','Из Ready планировщик выбирает поток в Running. Вытеснение возвращает его в Ready. Запрос ожидания переводит Running в Waiting; завершение события возвращает Waiting в Ready. Он не получает CPU автоматически: сначала снова должен быть выбран.','Ready → Running → Waiting → Ready','Почему Waiting не означает завершение?','Поток временно не может продолжить до события; после события он снова готов к планированию.'],
['12 мин','Потоки и разделяемые ресурсы','Поток — единица выполнения внутри процесса. Потоки одного процесса разделяют адресное пространство и многие ресурсы, включая открытые файлы; каждый имеет собственный стек, регистры и счётчик команд. Поэтому общаться через память удобно, но одновременный доступ требует синхронизации.','Ядерные потоки планируются ОС; пользовательские могут управляться библиотекой. В модели many-to-one блокирующий syscall одного пользовательского потока может заблокировать весь процесс; поведение зависит от реализации. Создание потока часто дешевле создания процесса, но фиксированного универсального коэффициента нет.','Процесс: общая память · поток A: стек A · поток B: стек B','Почему потоки нуждаются в синхронизации?','Их операции над общими данными могут перемежаться и нарушать инварианты.'],
['8 мин','Контекстное переключение','Пусть работает поток A. Таймер или блокировка приводит управление в ядро. Если нужно выбрать другой поток, ОС сохраняет необходимые регистры A, включая состояние указателя команд и стека, и обновляет его состояние.','Планировщик выбирает B из Ready. Диспетчер восстанавливает контекст B; при смене процесса может потребоваться смена адресного пространства. Процессор продолжает инструкции B. Переключение расходует время, но само по себе не выполняет полезную работу приложения.','A → сохранить → выбрать B → восстановить B → продолжить','Всегда ли переход в kernel mode меняет поток?','Нет. Ядро может обработать быстрый syscall и вернуться к тому же потоку.'],
['10 мин','Прерывания','Внешнее прерывание приходит от устройства или таймера. Исключение связано с текущей инструкцией, например деление на ноль. Программное прерывание инициируется инструкцией. Polling — периодический опрос состояния устройства; прерывание позволяет реагировать на сигнал.','Учебная последовательность: фиксация, сохранение состояния, передача обработчику, дополнительное сохранение, обработка, восстановление, возврат. Приоритеты определяют, может ли новый обработчик прервать текущий: относительные, абсолютные и LCFS. Реальная аппаратная последовательность зависит от архитектуры.','Событие → сохранить → обработать → восстановить → возврат','Всегда ли прерывание переключает поток?','Нет: после обработчика может продолжить тот же поток.'],
['5 мин','Самопроверка','Нарисуй четыре основных перехода состояний, сравни процесс и поток, восстанови семь этапов прерывания.','За 60 секунд опиши переключение контекста с RIP и RSP; объясни отличие переключения режима от переключения потока.','Определение → схема → пример','Что сохраняется при переключении?','Необходимое состояние текущего потока, включая регистры и указатели команд и стека; конкретный состав зависит от платформы.']
],
[
['8 мин','Планировщик и диспетчер','Когда готовых потоков больше, чем CPU, нужно решить, кто будет выполняться. Планировщик принимает решение по политике, диспетчер передаёт CPU выбранному потоку и восстанавливает его контекст. В лекции формулировки могут разделять эти роли иначе; называй и выбор, и передачу.','Долгосрочное планирование управляет допуском задач; среднесрочное связано с выгрузкой и возвратом; краткосрочное выбирает готовую задачу для CPU.','Очередь Ready → выбор → передача CPU','Почему выбор и передача — разные действия?','Одно определяет следующего кандидата, другое выполняет переключение и запуск.'],
['10 мин','Метрики на примере','Пусть процесс прибыл в A=2, впервые запущен в S=4, использовал CPU суммарно B=3 и завершился в C=8. Turnaround = C−A = 6: полное время в системе. Response = S−A = 2: ожидание до первого запуска.','В простой модели одного CPU burst без I/O waiting = turnaround−B = 3. При наличии I/O эта формула требует осторожности: время вне CPU включает и ожидание I/O. Загрузка CPU и throughput обычно увеличивают; времена ожидания и ответа уменьшают. Все критерии одновременно оптимизировать трудно.','A=2 → S=4 → C=8 · B=3','Почему turnaround и response не одно и то же?','Response заканчивается при первом запуске; turnaround — только при полном завершении.'],
['12 мин','FCFS и SJF','FCFS обслуживает в порядке прибытия. Если длинная задача идёт первой, короткие ждут за ней — эффект конвоя. Алгоритм прост, но среднее ожидание может быть большим.','SJF выбирает среди готовых задачу с наименьшим CPU burst и в невытесняющей версии выполняет её до конца. Для одинакового времени прибытия это уменьшает среднее ожидание, но длительность нужно прогнозировать. При постоянном потоке коротких задач длинная может голодать.','FCFS: порядок очереди · SJF: минимальный burst','Почему SJF сложно идеально реализовать?','Точное будущее время CPU заранее обычно неизвестно и оценивается по прошлому поведению.'],
['12 мин','SRTF, RR и приоритеты','SRTF выбирает процесс с наименьшим оставшимся временем. Если приходит более короткая задача, текущую можно вытеснить. RR даёт каждому фиксированный квант и возвращает незавершённого в конец очереди.','Слишком маленький квант повышает расходы на переключения; очень большой приближает RR к FCFS. Приоритетный алгоритм выбирает задачу по приоритету; низкоприоритетные могут голодать. Aging повышает приоритет долго ожидающих.','SRTF: остаток · RR: квант · Priority: приоритет','SJF и SRTF — в чём принципиальная разница?','В этой модели SJF не вытесняет текущую задачу, а SRTF может вытеснить её при изменении состава готовых.'],
['8 мин','Построй диаграмму','Для каждого момента учитывай только прибывшие и ещё не завершённые процессы. Выбери процесс по правилу алгоритма, отметь интервал на диаграмме, обнови остаток и очередь. Повторяй до завершения всех задач.','Затем найди первый запуск S и завершение C каждого процесса, вычисли turnaround, waiting и response. Перейди в CPU-тренажёр и реши задачу по одному такту.','Прибытия → выбор → интервал → остаток → метрики','Что делать, если ни один процесс ещё не прибыл?','Отметить простой CPU до ближайшего прибытия.'],
['5 мин','Самопроверка','Назови пять алгоритмов и по одному недостатку каждого. Построй две диаграммы и объясни компромисс между отзывчивостью, средним ожиданием и накладными расходами.','В тренажёре заданы конкретные правила равенства, порядок очереди и нулевая стоимость переключения: другие условия могут изменить ответ.','Правило → недостаток → расчёт','Как aging помогает?','Увеличивает приоритет ожидающей задачи и тем самым уменьшает риск голодания.']
],
[
['10 мин','Синхронность и асинхронность','При синхронном вызове вызывающий код получает результат после завершения операции. Если поток блокируется в ожидании сети, он не выполняет другую работу. При асинхронной организации запуск и получение результата разделены: продолжение выполняется после готовности результата.','В C# await асинхронного сетевого I/O может освободить поток на время ожидания. Это не обещание создать поток: конкретная реализация и момент завершения важны. Операция может завершиться сразу. Само async не делает тяжёлые вычисления параллельными.','Запрос → ожидание I/O → продолжение','Всегда ли async создаёт новый поток?','Нет. Асинхронное I/O может ожидать без выделенного простаивающего потока.'],
['8 мин','Конкурентность и параллелизм','Конкурентность означает, что несколько задач продвигаются в перекрывающиеся промежутки времени. На одном ядре они могут чередоваться: A, B, A, B. Параллелизм означает физически одновременное выполнение, например A и B на двух ядрах.','Конкурентная программа не обязана исполняться параллельно. Несколько потоков одного процесса могут работать параллельно на разных ядрах; отдельные процессы для этого не обязательны.','Одно ядро: A → B · два ядра: A ∥ B','Может ли на одном ядре быть конкурентность?','Да, задачи продвигаются попеременно; в каждый конкретный момент ядро выполняет один поток.'],
['7 мин','Потоки, CPU affinity и NUMA','Многопоточность организует несколько потоков внутри процесса. Многопроцессорность использует несколько CPU или ядер для выполнения. Разделяемая память удобна, но создаёт риск гонок.','Processor affinity ограничивает или предпочитает размещение потока на определённых CPU. В NUMA время доступа к памяти зависит от расположения памяти относительно процессора; поэтому размещение данных и потоков может влиять на производительность.','Потоки → планировщик → ядра → память NUMA','Почему общая память одновременно удобна и опасна?','Обмен быстрый, но несогласованные изменения общих данных приводят к гонкам.'],
['5 мин','Event Loop','Цикл событий получает готовую работу из очереди и запускает обработчик. Операции I/O могут ожидаться средствами ОС и runtime; по готовности продолжение или callback попадает в очередь. Порядок конкретных очередей зависит от среды.','Пока однопоточный обработчик выполняет долгие вычисления, цикл не может обработать следующие события. I/O-bound задача в основном ограничена ожиданием ввода-вывода, CPU-bound — вычислениями.','I/O запрос → готовность → очередь → обработчик','Что произойдёт, если обработчик надолго займёт CPU?','Другие готовые события и продолжения будут ждать его возвращения.'],
['5 мин','Самопроверка','Придумай пример async I/O без простаивающего выделенного потока, конкурентности на одном ядре и параллельного вычисления на двух ядрах.','Объясни event loop за 90 секунд, включая очередь, готовность I/O и проблему долгого обработчика.','Определение → механизм → пример','Почему async и параллелизм можно сочетать?','Они описывают разные аспекты: организацию ожидания и физическую одновременность вычислений.']
]];
const prevLesson=lecture;lecture=function(i){prevLesson(i);let root=document.createElement('div');root.className='card';root.innerHTML='<span class="tag">Последовательный урок</span><h3>Учись по шагам</h3><p>Время — ориентир из плана. Прочитай объяснение, ответь на вопрос и только затем переходи дальше.</p><div id="guided"></div>';let app=$('#app');app.insertBefore(root,app.children[3]);let n=0;function draw(){let s=guided[i][n];$('#guided').innerHTML=`<div class="vizbox"><span class="tag">Шаг ${n+1} из ${guided[i].length} · ${s[0]}</span><h3>${s[1]}</h3><p>${s[2]}</p><p>${s[3]}</p><div class="flow"><span>${s[4]}</span></div><p><b>Проверь себя:</b> ${s[5]}</p><details><summary>Показать ответ</summary><p class="reveal">${s[6]}</p></details></div><div class="row" style="margin-top:12px"><button id="guidePrev" ${n===0?'disabled':''}>← Назад</button><button id="guideNext" ${n===guided[i].length-1?'disabled':''}>Дальше →</button></div><p class="tiny">После урока ниже доступны тесты и интерактивные тренажёры.</p>`;$('#guidePrev').onclick=()=>{n--;draw()};$('#guideNext').onclick=()=>{n++;draw()}}draw()};

render();</script></body></html>
